
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>LIBRA — Settings</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <aside class="sidebar">

        <a class="brand" href="index.html">
            <span class="brand-mark">Ⅲ</span>
            <span>Libra</span>
        </a>

        <nav class="nav" aria-label="Main navigation">

            <a class="nav-link" href="index.html">
                <span class="nav-icon">▦</span>
                Dashboard
            </a>

            <a class="nav-link" href="books.html">
                <span class="nav-icon">▤</span>
                Books
            </a>

            <a class="nav-link" href="members.html">
                <span class="nav-icon">♧</span>
                Members
            </a>

            <a class="nav-link" href="circulation.html">
                <span class="nav-icon">⇄</span>
                Circulation
            </a>

            <a class="nav-link active" href="settings.html">
                <span class="nav-icon">⚙</span>
                Settings
            </a>

        </nav>

        <div class="sidebar-bottom">

            <section class="lending-card">
                <h2>Lending desk</h2>
                <p>Check a book out to a member in seconds.</p>

                <a class="btn btn-orange btn-wide" href="circulation.html">
                    ＋ &nbsp;Issue a book
                </a>
            </section>

            <div class="profile">

                <span class="avatar avatar-dark">VK</span>

                <span class="profile-copy">
                    <strong>Vinuthna Kotha</strong>
                    <small>Librarian</small>
                </span>

                <span class="chevrons">⌃<br>⌄</span>

            </div>

        </div>

    </aside>

    <main class="main">

        <header class="topbar">

            <label class="search">
                <span class="search-icon">⌕</span>

                <input
                    id="globalSearch"
                    type="search"
                    placeholder="Search book name, author, ISBN..."
                >
            </label>

            <button
                class="notification"
                id="notificationButton"
                aria-label="Notifications"
            >
                ♧
                <span class="notification-count">8</span>
            </button>

        </header>

        <header class="section-heading">
            <h1>Settings</h1>
            <p>
                Lending rules apply to new loans, renewals and fines right away.
            </p>
        </header>

        <form id="settingsForm">

            <section class="panel settings-card">

                <h2>Lending rules</h2>

                <div class="settings-grid">

                    <label>
                        Loan period (days)
                        <input
                            name="loanDays"
                            value="14"
                            min="1"
                            type="number"
                            required
                        >
                    </label>

                    <label>
                        Late fine per day (₹)
                        <input
                            name="finePerDay"
                            value="5"
                            min="0"
                            type="number"
                            required
                        >
                    </label>

                    <label>
                        Renewals allowed per loan
                        <input
                            name="maxRenewals"
                            value="2"
                            min="0"
                            type="number"
                            required
                        >
                    </label>

                    <label>
                        Stop borrowing when fines reach (₹)
                        <input
                            name="stopFine"
                            value="200"
                            min="0"
                            type="number"
                            required
                        >
                    </label>

                </div>

            </section>

            <section class="panel settings-card">

                <h2>Books at a time</h2>

                <div class="settings-grid three">

                    <label>
                        Student
                        <input
                            name="studentLimit"
                            value="3"
                            min="1"
                            type="number"
                            required
                        >
                    </label>

                    <label>
                        Standard
                        <input
                            name="standardLimit"
                            value="4"
                            min="1"
                            type="number"
                            required
                        >
                    </label>

                    <label>
                        Premium
                        <input
                            name="premiumLimit"
                            value="6"
                            min="1"
                            type="number"
                            required
                        >
                    </label>

                </div>

            </section>

            <div class="settings-actions">

                <button
                    class="btn btn-light"
                    type="button"
                    id="restoreData"
                >
                    ↶ &nbsp;Restore sample library
                </button>

                <button class="btn btn-dark" type="submit">
                    Save rules
                </button>

            </div>

        </form>

    </main>

    <script src="app.js"></script>

</body>
</html>
