
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>LIBRA — Circulation</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <aside class="sidebar">

        <a class="brand" href="index.html">
            <span class="brand-mark">Ⅲ</span>
            <span>Libra</span>
        </a>

        <nav class="nav">
            <a class="nav-link" href="index.html">
                <span class="nav-icon">▦</span>
                Dashboard
            </a>

            <a class="nav-link" href="books.html">
                <span class="nav-icon">▤</span>
                Books
            </a>

            <a class="nav-link" href="members.html">
                <span class="nav-icon">♧</span>
                Members
            </a>

            <a class="nav-link active" href="circulation.html">
                <span class="nav-icon">⇄</span>
                Circulation
            </a>

            <a class="nav-link" href="settings.html">
                <span class="nav-icon">⚙</span>
                Settings
            </a>
        </nav>

        <div class="sidebar-bottom">

            <section class="lending-card">
                <h2>Lending desk</h2>
                <p>Check a book out to a member in seconds.</p>

                <a class="btn btn-orange btn-wide" href="circulation.html">
                    ＋ &nbsp;Issue a book
                </a>
            </section>

            <div class="profile">
                <span class="avatar avatar-dark">VK</span>

                <span class="profile-copy">
                    <strong>Vinuthna Kotha</strong>
                    <small>Librarian</small>
                </span>

                <span class="chevrons">⌃<br>⌄</span>
            </div>

        </div>
    </aside>

    <main class="main">

        <header class="topbar">

            <label class="search">
                <span class="search-icon">⌕</span>

                <input
                    id="globalSearch"
                    type="search"
                    placeholder="Search book name, author, ISBN..."
                >
            </label>

            <button
                class="notification"
                id="notificationButton"
                aria-label="Notifications"
            >
                ♧
                <span class="notification-count">8</span>
            </button>

        </header>

        <header class="section-heading">
            <h1>Circulation</h1>
            <p>Loans, renewals, returns and overdue fines.</p>
        </header>

        <section class="panel circulation-panel">

            <div class="circulation-toolbar">

                <div class="view-tabs">

                    <button class="active" data-circulation-tab="On loan">
                        On loan <b>0</b>
                    </button>

                    <button data-circulation-tab="Overdue">
                        Overdue <b>0</b>
                    </button>

                    <button data-circulation-tab="Returned">
                        Returned <b>0</b>
                    </button>

                    <button data-circulation-tab="Fines">
                        Fines <b>0</b>
                    </button>

                </div>

                <div class="circulation-actions">

                    <input
                        id="circulationSearch"
                        type="search"
                        placeholder="Filter by book or member"
                    >

                    <button class="btn btn-dark" id="issueBookButton">
                        ＋ Issue a book
                    </button>

                </div>

            </div>

            <div class="table-wrap">

                <table class="circulation-table">

                    <thead>
                        <tr>
                            <th>Book</th>
                            <th>Member</th>
                            <th>Borrowed</th>
                            <th>Due</th>
                            <th>Fine</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>

                    <tbody id="circulationTable"></tbody>

                </table>

            </div>

        </section>

    </main>

    <script src="app.js"></script>

</body>
</html>
